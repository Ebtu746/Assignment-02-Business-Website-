<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <title>Marifa Digital - Contact</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <h1 class="logo">Marifa Digital</h1>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h2>Contact Me</h2>
            <p>
                Have a question or a project? Send me a message.
            </p>
        </section>

        <section class="contact">
            <div class="contact-info">
                <h2>Let's Talk</h2>
                <p>
                    I would be happy to hear about your project
                    and discuss how I can help.
                </p>
                <p>Email: marifa.muhammed.hassen@gmail.com</p>
                <p>Location: Ethiopia</p>
            </div>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name"required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" placeholder="Write your message here" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Marifa Digital. All rights reserved.</p>
    </footer>
</body>
</html>
